# Cubefire Arena's public site: the game page and the multiplayer connections.
# Everything it stores lives in the cubefire-arena worker's Durable Objects (wrangler.toml).
# Deploy with `npx wrangler deploy -c wrangler.site.toml` after running ../build.py.
name = "cf-ys7a0vi"
main = "src/worker.js"
compatibility_date = "2025-09-01"
workers_dev = true
preview_urls = false

[assets]
directory = "./public"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"
script_name = "cubefire-arena"

[[durable_objects.bindings]]
name = "ACCOUNTS"
class_name = "Accounts"
script_name = "cubefire-arena"

[[durable_objects.bindings]]
name = "ROYALE"
class_name = "Royale"
script_name = "cubefire-arena"

[triggers]
crons = ["* * * * *"]   # wake the battle royale every minute
