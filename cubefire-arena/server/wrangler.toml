# Cubefire Arena: game page + multiplayer relay on Cloudflare Workers.
# Deploy with `npx wrangler deploy` after running ../build.py.
name = "cubefire-arena"
main = "src/worker.js"
compatibility_date = "2025-09-01"
workers_dev = false   # no public address: the game is at cubefire.secret321.workers.dev (wrangler.site.toml); this worker keeps the data and the schedule
preview_urls = false

[assets]
directory = "./public"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Lobby"]

[[durable_objects.bindings]]
name = "ACCOUNTS"
class_name = "Accounts"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Accounts"]

[[durable_objects.bindings]]
name = "ROYALE"
class_name = "Royale"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Royale"]

[triggers]
crons = ["* * * * *"]   # wake the battle royale every minute
