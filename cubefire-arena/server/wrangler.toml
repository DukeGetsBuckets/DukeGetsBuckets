# Cubefire Arena's data: accounts, lobbies and the battle royale (Durable Objects).
# This worker has no web address any more (the old cubefire-arena address is off);
# the game is served by the worker in wrangler.site.toml, which uses these objects.
# Deploy both after ../build.py: `npx wrangler deploy` then `npx wrangler deploy -c wrangler.site.toml`.
name = "cubefire-arena"
main = "src/worker.js"
compatibility_date = "2025-09-01"
workers_dev = false
preview_urls = false

[assets]
directory = "./public"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Lobby"]

[[durable_objects.bindings]]
name = "ACCOUNTS"
class_name = "Accounts"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Accounts"]

[[durable_objects.bindings]]
name = "ROYALE"
class_name = "Royale"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Royale"]
