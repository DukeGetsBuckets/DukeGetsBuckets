<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ejlnab</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23000'/%3E%3C/svg%3E">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #000; color: #fff; }
  body {
    min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column;
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, Segoe UI, Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; padding: 0 16px calc(28px + env(safe-area-inset-bottom));
  }
  main { flex: 1; display: flex; align-items: center; justify-content: center; }
  .wrap { width: 100%; max-width: 560px; }
  h1 { font-size: 46px; font-weight: 600; letter-spacing: .2em; text-align: center; margin: 0; opacity: .92; text-transform: lowercase; }
  footer { text-align: center; padding-top: 16px; }
  .copy {
    display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 26px;
    border: 1px solid #2a2a2a; border-radius: 999px; background: #000; color: #fff; font: inherit; font-weight: 600;
    text-decoration: none; cursor: pointer; -webkit-user-drag: element; user-select: none; -webkit-user-select: none;
  }
  .copy:active { background: #141414; }
  .offscreen { position: absolute; left: -9999px; top: 0; width: 1px; height: 1px; opacity: 0; }
  .hidden { display: none !important; }
  .muted { color: #8a8a8a; }
  .status { padding: 10px 12px; border-radius: 10px; background: #111; border: 1px solid #222; margin: 12px 0; }
  .status.error { border-color: #5a1a1a; }
  .result { border-top: 1px solid #1f1f1f; padding: 12px 0; }
  .result:first-child { border-top: 0; }
  .result .q { color: #8a8a8a; font-size: 14px; }
  .result .a { font-weight: 700; color: #4ade80; font-size: 18px; }
  .result .a small { font-weight: 400; color: #8a8a8a; font-size: 13px; margin-left: 8px; }
  .result .e { font-size: 14px; color: #8a8a8a; }
  .drop { display: block; border: 1px dashed #2a2a2a; border-radius: 14px; padding: 22px; text-align: center; cursor: pointer; }
  .drop input { display: none; }
</style>
</head>
<body>
<main>
  <div class="wrap">
    <div id="home"><h1>ejlnab</h1></div>

    <div id="relay" class="hidden">
      <p class="muted" id="relayStatus">Waiting…</p>
      <div id="relayResults"></div>
    </div>

    <div id="shot" class="hidden">
      <label class="drop">
        <input id="file" type="file" accept="image/*">
        <span class="copy" style="pointer-events:none">Choose image</span>
        <div class="muted" style="margin-top:8px;font-size:14px">or paste one here</div>
      </label>
      <div id="shotStatus" class="hidden"></div>
      <div id="shotResults"></div>
    </div>
  </div>
</main>
<footer>
  <a id="copy" class="copy" href="#">Copy link</a>
  <textarea id="code" class="offscreen" readonly tabindex="-1" aria-hidden="true"></textarea>
</footer>

<script>
(function () {
  var BOOKMARKLET = __BOOKMARKLET_JSON__;
  var $ = function (id) { return document.getElementById(id); };
  var params = new URLSearchParams(location.search);

  function renderResults(container, data) {
    container.textContent = "";
    var qs = (data && data.questions) || [];
    if (!qs.length) {
      var none = document.createElement("div"); none.className = "muted"; none.textContent = "Nothing found.";
      container.appendChild(none); return;
    }
    qs.forEach(function (q, i) {
      var r = document.createElement("div"); r.className = "result";
      var qEl = document.createElement("div"); qEl.className = "q"; qEl.textContent = (i + 1) + ". " + (q.question || "");
      var aEl = document.createElement("div"); aEl.className = "a"; aEl.textContent = q.answer || "?";
      if (typeof q.confidence === "number") { var c = document.createElement("small"); c.textContent = Math.round(q.confidence * 100) + "%"; aEl.appendChild(c); }
      r.appendChild(qEl); r.appendChild(aEl);
      if (q.explanation) { var e = document.createElement("div"); e.className = "e"; e.textContent = q.explanation; r.appendChild(e); }
      container.appendChild(r);
    });
  }

  function ask(payload) {
    return fetch("/api/answer", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(payload) })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || ("HTTP " + r.status)); return j; }); });
  }

  /* copy / drag the bookmark */
  var copy = $("copy");
  copy.setAttribute("href", BOOKMARKLET);
  $("code").value = BOOKMARKLET;
  copy.addEventListener("click", function (e) {
    e.preventDefault();
    var done = function (ok) { copy.textContent = ok ? "Copied" : "Copy failed"; setTimeout(function () { copy.textContent = "Copy link"; }, 2000); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(BOOKMARKLET).then(function () { done(true); }, fallback);
    else fallback();
    function fallback() {
      var ta = $("code"); ta.focus(); ta.select();
      try { done(document.execCommand("copy")); } catch (err) { done(false); }
    }
  });

  /* relay mode: a page whose site blocks fetch opened this tab */
  if (params.get("relay") === "1" && window.opener) {
    $("home").classList.add("hidden");
    $("relay").classList.remove("hidden");
    var status = $("relayStatus");
    window.addEventListener("message", function (e) {
      if (!e.data || e.data.type !== "answerscan-scan") return;
      var source = e.source, origin = e.origin;
      status.textContent = "Working…";
      ask(e.data.payload).then(function (data) {
        status.textContent = (data.questions || []).length + " found. Go back to the other tab.";
        renderResults($("relayResults"), data);
        source.postMessage({ type: "answerscan-result", data: data }, origin);
      }).catch(function (err) {
        status.textContent = "Error: " + err.message;
        source.postMessage({ type: "answerscan-error", error: err.message }, origin);
      });
    });
    window.opener.postMessage({ type: "answerscan-ready" }, "*");
    return;
  }

  /* screenshot mode: /?shot=1 */
  if (params.get("shot") === "1") {
    $("home").classList.add("hidden");
    $("shot").classList.remove("hidden");
    var shotStatus = $("shotStatus"), shotResults = $("shotResults");
    var setShot = function (msg, isError) { shotStatus.className = "status" + (isError ? " error" : ""); shotStatus.textContent = msg; };
    var downscale = function (file) {
      return new Promise(function (resolve, reject) {
        var img = new Image(), url = URL.createObjectURL(file);
        img.onload = function () {
          var max = 1600, w = img.naturalWidth, h = img.naturalHeight, s = Math.min(1, max / Math.max(w, h));
          var c = document.createElement("canvas"); c.width = Math.round(w * s); c.height = Math.round(h * s);
          c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
          URL.revokeObjectURL(url);
          resolve({ media_type: "image/jpeg", data: c.toDataURL("image/jpeg", 0.88).split(",")[1] });
        };
        img.onerror = function () { URL.revokeObjectURL(url); reject(new Error("Not an image.")); };
        img.src = url;
      });
    };
    var scanImage = function (file) {
      if (!file) return;
      shotResults.textContent = "";
      setShot("Reading…");
      downscale(file).then(function (image) { setShot("Working…"); return ask({ image: image, title: "screenshot" }); })
        .then(function (data) { setShot((data.questions || []).length + " found"); renderResults(shotResults, data); })
        .catch(function (err) { setShot("Error: " + err.message, true); });
    };
    $("file").addEventListener("change", function () { scanImage(this.files && this.files[0]); this.value = ""; });
    document.addEventListener("paste", function (e) {
      var items = (e.clipboardData && e.clipboardData.items) || [];
      for (var i = 0; i < items.length; i++) if (items[i].type.indexOf("image/") === 0) { scanImage(items[i].getAsFile()); break; }
    });
  }
})();
</script>
</body>
</html>
